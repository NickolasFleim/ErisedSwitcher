# Проверка каждого коммита и pull request.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  linux:
    name: Тесты (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...

  windows:
    name: Тесты и самопроверка (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Сборка
        run: |
          GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o ErisedSwitcher.exe ./cmd/erised
          GOARCH=arm64 go build -trimpath -ldflags "-H windowsgui -s -w" -o ErisedSwitcher-arm64.exe ./cmd/erised
      - name: Самопроверка на настоящей Windows
        run: |
          ./ErisedSwitcher.exe --selftest selftest.txt; code=$?
          cat selftest.txt || echo "::error::Самопроверка не создала отчёт (код $code)"
          # Ошибки — отдельными пометками, их видно на странице запуска.
          grep '^FAIL' selftest.txt | sed 's/^FAIL */::error title=Самопроверка::/' || true
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ErisedSwitcher-${{ github.sha }}
          path: |
            ErisedSwitcher*.exe
            selftest.txt

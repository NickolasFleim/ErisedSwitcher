<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erised Switcher — настройки</title>
<style>
:root {
  --paper: #f3f4f7;
  --panel: #ffffff;
  --ink: #1b2130;
  --muted: #5c667a;
  --line: #d8dde6;
  --cap: #ffffff;
  --cap-edge: #c3cad6;
  --en: #2563eb;
  --ru: #dc2626;
  --ok: #15803d;
  --warn: #b45309;
  --focus: #2563eb;
  --gold: #9a7128;
  --mono: "Cascadia Mono", "Consolas", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #161a22; --panel: #1e232d; --ink: #e7eaf0; --muted: #9aa3b5; --line: #323947;
    --cap: #272d39; --cap-edge: #11151c; --en: #6b9bff; --ru: #ff6b6b; --ok: #4ade80; --warn: #fbbf24; --focus: #6b9bff; --gold: #d4a64a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
nav { padding: 24px 16px; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow: auto; }
/* Название с отражением — как в зеркале */
.brand { display: flex; align-items: flex-start; gap: 10px; margin: 0 4px 14px; }
.brand svg { flex: none; margin-top: 1px; }
.wordmark { position: relative; }
.brand h1, .brand .reflection { font: 600 20px/1.1 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.brand h1 span, .brand .reflection span { font-weight: 400; color: var(--muted); }
.brand .reflection {
  transform: scaleY(-1); opacity: .32; margin-top: -2px; user-select: none; pointer-events: none;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 95%); mask-image: linear-gradient(to top, #000 10%, transparent 95%);
}
.inscription { margin: 22px 4px 0; font: italic 13px/1.4 Georgia, "Times New Roman", serif; color: var(--gold); opacity: .8; cursor: help; }

/* Вкладки — как клавиши */
.tabs { display: flex; flex-direction: column; gap: 8px; }
.tab {
  text-align: left; padding: 9px 12px; border-radius: 8px; cursor: pointer;
  background: var(--cap); border: 1px solid var(--line); border-bottom: 3px solid var(--cap-edge);
  transition: transform .06s, border-bottom-width .06s;
}
.tab:hover { border-color: var(--cap-edge); }
.tab:active { transform: translateY(2px); border-bottom-width: 1px; }
.tab[aria-selected="true"] { transform: translateY(2px); border-bottom-width: 1px; border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tab small { display: block; color: var(--muted); font-size: 12px; }

.status { margin: 24px 4px 0; font-size: 13px; color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; }

main { padding: 28px 40px 120px; max-width: 980px; }
main h2 { font: 600 24px/1.25 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0 0 6px; letter-spacing: -0.01em; }
.lead { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
section[hidden] { display: none; }

.group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 20px; margin-bottom: 20px; }
.group h3 { font-size: 15px; font-weight: 600; margin: 16px 0 4px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.group > .row:first-child, .group > h3 + .row { border-top: 0; }
.row label { font-weight: 500; }
.row .help { color: var(--muted); font-size: 13px; margin-top: 2px; }
.row.wide { grid-template-columns: 1fr; }
.row.changed label::after { content: "изменено"; margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--warn); }

input[type=text], input[type=number], select, textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper);
}
textarea { min-height: 110px; resize: vertical; font-family: var(--mono); font-size: 13px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--en); }
.inherit { color: var(--muted); font-style: italic; }

.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); border-bottom: 2px solid var(--cap-edge); background: var(--cap); cursor: pointer; }
a.btn { color: inherit; text-decoration: none; display: inline-block; }
.btn:active { transform: translateY(1px); border-bottom-width: 1px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.danger { color: var(--ru); }
.btn.danger-fill { background: var(--ru); border-color: var(--ru); color: #fff; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.savebar {
  position: fixed; left: 232px; right: 0; bottom: 0; padding: 12px 40px; display: flex; gap: 12px; align-items: center;
  background: var(--panel); border-top: 1px solid var(--line); transform: translateY(100%); transition: transform .18s;
}
.savebar.show { transform: none; }
.savebar .msg { color: var(--muted); }
.toast { position: fixed; right: 24px; top: 20px; padding: 10px 16px; border-radius: 8px; background: var(--ink); color: var(--paper); max-width: 460px; white-space: pre-line; display: none; z-index: 9; }
.toast.err { background: var(--ru); color: #fff; }

/* Правила приложений */
.rule { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 14px; }
.rule > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; gap: 12px; align-items: center; }
.rule > summary::-webkit-details-marker { display: none; }
.rule > summary .name { font-weight: 600; }
.rule > summary .procs { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.rule .body { padding: 0 18px 12px; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.off { color: var(--ru); border-color: var(--ru); }

/* Таблицы слов */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.word { font-family: var(--mono); }
td .btn { margin-right: 4px; }
.lang { display: inline-block; min-width: 26px; text-align: center; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 700; padding: 1px 4px; }
.lang.en { background: var(--en); } .lang.ru { background: var(--ru); } .lang.uk { background: #b7791f; }
.filters { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.filters input, .filters select { max-width: 260px; }
.empty { color: var(--muted); padding: 18px 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }

/* Проверка: слова-клавиши */
.probe textarea { min-height: 80px; font-family: inherit; font-size: 16px; }
.caps { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.cap {
  min-width: 120px; padding: 10px 12px 8px; border-radius: 10px; background: var(--cap);
  border: 1px solid var(--line); border-bottom: 4px solid var(--cap-edge); position: relative;
}
.cap .from { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.cap .to { font-size: 18px; font-weight: 600; }
.cap.sw-ru { border-bottom-color: var(--ru); } .cap.sw-en { border-bottom-color: var(--en); } .cap.sw-uk { border-bottom-color: #b7791f; }
.cap .why { font-size: 12px; color: var(--muted); max-width: 240px; margin-top: 4px; }
.cap .nums { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
.crash summary { cursor: pointer; padding: 6px 0; }
.crash pre.notes, .update-status pre.notes { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 inherit; font-family: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 260px; overflow: auto; margin: 6px 0; }
.update-status a { color: var(--focus); }
.cap .typo { color: var(--ink); border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 6px; }

.log td { font-size: 13px; }
.kbd { font-family: var(--mono); font-size: 13px; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--cap); }
.recording { box-shadow: 0 0 0 2px var(--ru) inset; }
.hk { display: flex; gap: 6px; }
.note { border-left: 3px solid var(--warn); padding: 6px 12px; color: var(--muted); margin: 0 0 16px; font-size: 14px; }

/* Мастер первого запуска */
.modal-back { position: fixed; inset: 0; background: rgba(10, 14, 22, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 8; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px 28px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h2 { margin: 0 0 6px; }
.modal .steps { display: flex; gap: 6px; margin: 0 0 18px; }
.modal .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.modal .steps i.on { background: var(--gold); }
.modal .row { grid-template-columns: minmax(0, 1fr) 220px; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; align-items: center; }
.modal .foot .skip { margin-right: auto; }
.choice { display: grid; gap: 8px; margin: 8px 0 4px; }
.choice label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-weight: 400; }
.choice label:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice input { margin-top: 3px; accent-color: var(--en); }
.choice b { display: block; font-weight: 600; }
.choice small { color: var(--muted); }

@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .tabs { flex-direction: row; flex-wrap: wrap; }
  .tab small { display: none; }
  main { padding: 20px 16px 120px; }
  .row { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
  .savebar { left: 0; padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <nav>
    <div class="brand">
      <svg width="24" height="30" viewBox="0 0 24 30" aria-hidden="true">
        <path d="M2 28V11a10 10 0 0 1 20 0v17z" fill="var(--gold)"/>
        <path d="M4.5 26V11a7.5 7.5 0 0 1 15 0v15z" fill="#1f2f57"/>
        <path d="M7 15l7-7" stroke="#d6e4f5" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="wordmark"><h1>Erised <span>Switcher</span></h1><div class="reflection" aria-hidden="true">Erised <span>Switcher</span></div></div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="status" id="status"></div>
    <p class="inscription" title="Надпись на раме зеркала. Прочтите её задом наперёд: зеркало показывает не лицо, а желание сердца. А переключатель — не то, что вы набрали, а то, что хотели написать.">Erised stra ehru oyt ube cafru oyt on wohsi</p>
  </nav>
  <main id="main"></main>
</div>
<div class="savebar" id="savebar"><button class="btn primary" id="save">Сохранить</button><button class="btn" id="revert">Отменить изменения</button><span class="msg" id="savemsg">Есть несохранённые изменения</span></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
async function api(path, body) {
  const opt = { headers: { "X-Token": token } };
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "Нет ответа от программы. Она запущена?" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", err ? 9000 : 2800);
}

// ---------- Описание параметров ----------
const RULE_FIELDS = [
  { g: "Когда исправлять" },
  { k: "mode", t: "select", l: "Режим", h: "Автоматически, только по горячим клавишам или не трогать вовсе.", o: [["auto", "Автоматически"], ["manual", "Только вручную"], ["off", "Выключено"]] },
  { k: "correct_on_space", t: "bool", l: "Проверять слово после пробела" },
  { k: "correct_on_enter", t: "bool", l: "Проверять слово перед Enter", h: "В терминале исправление произойдёт до выполнения команды." },
  { k: "correct_on_tab", t: "bool", l: "Проверять слово перед Tab", h: "Обычно выключено: в терминале Tab — автодополнение." },
  { k: "early_switch", t: "bool", l: "Переключать посреди слова", h: "Если начало слова невозможно в текущей раскладке, исправлять не дожидаясь пробела." },
  { k: "early_min_len", t: "int", l: "Посреди слова — не раньше чем после N букв" },
  { k: "skip_first_word", t: "bool", l: "Не трогать первое слово строки", h: "Полезно, если первое слово — команда." },
  { g: "Уверенность" },
  { k: "min_len", t: "int", l: "Минимальная длина слова", h: "Слова короче не исправляются (кроме однобуквенных по контексту)." },
  { k: "dictionary_only", t: "bool", l: "Только по словарю", h: "Исправлять, только если второй вариант — известное слово. Надёжнее, но реже." },
  { k: "short_word_min_zipf", t: "float", l: "Короткие слова: минимальная частотность", h: "Для слов из 2–3 букв. Шкала 1–7: 7 — «не», «the»; 3 — редкое слово. Больше — осторожнее." },
  { k: "short_word_cur_max", t: "float", l: "Короткие слова: насколько странно должен выглядеть текущий вариант", h: "Оценка букв от −5 (невозможно) до 0. Меньше — осторожнее." },
  { k: "dict_cur_max", t: "float", l: "Словарные слова: насколько странно должен выглядеть текущий вариант", h: "Для слов от 4 букв, если второй вариант есть в словаре, но редкий." },
  { k: "single_letter_context", t: "bool", l: "Исправлять однобуквенные слова по контексту", h: "z → я, d → в, если предыдущее слово фразы русское." },
  { k: "single_letter_start", t: "bool", l: "Исправлять однобуквенные слова в начале фразы", h: "z → я, d → в, ш → I в начале строки или после щелчка. Только если в текущей раскладке такого слова нет («a» и «I» в английском, «в», «с», «я» в русском и т. п.). После английского слова («plan b») не исправляется." },
  { g: "Незнакомые слова (статистика букв)" },
  { k: "ngram_min_len", t: "int", l: "Минимальная длина", h: "Слова, которых нет в словаре, исправляются по сочетаниям букв, начиная с этой длины." },
  { k: "ngram_cur_max", t: "float", l: "Текущий вариант не лучше чем", h: "Обычные слова набирают от −1,4 до −0,8; набранные не в той раскладке — от −3,5 до −1,8." },
  { k: "ngram_alt_min", t: "float", l: "Второй вариант не хуже чем" },
  { k: "ngram_margin", t: "float", l: "Разница не меньше", h: "Насколько второй вариант должен быть вероятнее текущего." },
  { g: "Что не трогать" },
  { k: "skip_with_digits", t: "bool", l: "Слова с цифрами" },
  { k: "skip_chars", t: "text", l: "Слова с этими символами внутри", h: "Как слово видно на экране. Не добавляйте . , ; ' [ ] ` — в русской раскладке это буквы." },
  { k: "prefer_words", t: "textarea", l: "Слова, которые здесь всегда правильные", h: "Через пробел. Набранные не в той раскладке, исправляются всегда (например, команды: git cd ls)." },
  { g: "Ввод и раскладка" },
  { k: "undo_by_backspace", t: "bool", l: "Backspace сразу после исправления отменяет его", h: "Отменённое слово попадает в исключения (см. «Собранные слова»)." },
  { k: "switch_layout", t: "bool", l: "Переключать раскладку после исправления" },
  { k: "inject", t: "select", l: "Как печатать исправление", h: "Символы — работает везде, в т.ч. в терминалах. Клавиши — повтор нажатий после переключения раскладки, для программ, которые не принимают символы.", o: [["unicode", "Символами (Unicode)"], ["keys", "Клавишами"]] },
  { k: "layout_source", t: "select", l: "Как узнавать текущую раскладку", h: "«Консоль» — через API консоли (для старых окон cmd/PowerShell). «Сам» — помнить, на что переключали.", o: [["auto", "Автоматически"], ["focus", "По окну с фокусом"], ["console", "Через API консоли"], ["tracked", "Запоминать самому"]] },
  { k: "backspace_delay_ms", t: "int", l: "Пауза между Backspace, мс", h: "Увеличьте, если в программе стирается не всё." },
  { k: "key_delay_ms", t: "int", l: "Пауза между символами, мс" },
  { k: "switch_delay_ms", t: "int", l: "Пауза после переключения раскладки, мс" },
  { g: "Выделенный текст и сбор слов" },
  { k: "selection_allowed", t: "bool", l: "Разрешить конвертацию выделения" },
  { k: "copy_combo", t: "text", l: "Чем копировать выделение", h: "Например Ctrl+C, а в Windows Terminal — Ctrl+Shift+C." },
  { k: "reselect_after_convert", t: "bool", l: "Выделять текст после конвертации", h: "Тогда повторное нажатие вернёт текст как было." },
  { k: "learn_passive", t: "bool", l: "Собирать незнакомые слова, которые вы не исправляете" },
  { g: "Исправление опечаток", sec: "p" },
  { k: "autocorrect", t: "select", l: "Опечатки", h: "Исправлять при пробеле (Backspace сразу после — вернуть как было) или только показывать правильный вариант первым в полоске.", o: [["auto", "Исправлять при пробеле"], ["suggest", "Только подсказывать"], ["off", "Не трогать"]] },
  { k: "autocorrect_min_len", t: "int", l: "Не исправлять слова короче", h: "Из трёх букв исправляются только очевидные ошибки в очень частых словах (teh → the)." },
  { k: "autocorrect_max_dist_short", t: "float", l: "Допустимая ошибка в словах до 5 букв", h: "1 — одна ошибка. Соседняя клавиша или перестановка букв стоят 0,6, пропущенная двойная буква — 0,5." },

// ---------- Поля ----------
function field(def, obj, key, opts = {}) {
  const inherit = opts.inherit;              // для правил приложения: значение null = как в общих
  const base = opts.base;                    // значение из общих (для подсказки)
  const val = obj[key];
  const set = (v) => { obj[key] = v; markDirty(); row.classList.toggle("changed", JSON.stringify(v) !== JSON.stringify(opts.orig)); };
  let input;
  const baseText = base === undefined ? "" : (def.t === "bool" ? (base ? "да" : "нет") : def.o ? (def.o.find(o => o[0] === base) || [, base])[1] : String(base));
  if (def.t === "bool") {
    if (inherit) {
      input = el("select", { onchange: e => set(e.target.value === "" ? null : e.target.value === "1") },
        el("option", { value: "" }, `Как в общих (${baseText})`), el("option", { value: "1" }, "Да"), el("option", { value: "0" }, "Нет"));
      input.value = val === null || val === undefined ? "" : val ? "1" : "0";
    } else {
      input = el("input", { type: "checkbox", onchange: e => set(e.target.checked) });
      input.checked = !!val;
    }
  } else if (def.t === "select") {
    input = el("select", { onchange: e => set(e.target.value === "" ? null : e.target.value) },
      inherit ? el("option", { value: "" }, `Как в общих (${baseText})`) : null, def.o.map(([v, n]) => el("option", { value: v }, n)));
    input.value = val ?? "";
  } else if (def.t === "textarea") {
    input = el("textarea", { placeholder: inherit ? `Как в общих${base ? ": " + String(base).slice(0, 60) + "…" : " (пусто)"}` : "", oninput: e => set(e.target.value === "" && inherit ? null : e.target.value) });
    input.value = val ?? "";
  } else {
    const num = def.t === "int" || def.t === "float";
    input = el("input", {
      type: num ? "number" : "text", step: def.t === "float" ? "0.1" : "1", placeholder: inherit ? `Как в общих: ${baseText}` : "",
      oninput: e => {
        const s = e.target.value;
        if (s === "") return set(inherit ? null : (num ? 0 : ""));
        set(num ? (def.t === "int" ? parseInt(s, 10) : parseFloat(s)) : s);
      }
    });
    input.value = val ?? "";
  }
  input.id = (opts.prefix || "f") + "-" + key;
  const row = el("div", { class: "row" + (def.t === "textarea" ? " wide" : "") },
    el("div", {}, el("label", { for: input.id }, def.l), def.h ? el("div", { class: "help" }, def.h) : null), input);
  return row;
}
function ruleForm(obj, opts) {
  const frag = [];
  let grp = null, sec = "";
  for (const d of RULE_FIELDS) {
    if (d.g) {
      sec = d.sec || "";
      if (opts.only !== undefined && opts.only !== sec) { grp = null; continue; }
      grp = el("div", { class: "group" }, el("h3", {}, d.g)); frag.push(grp); continue;
    }
    if (!grp) continue;
    grp.append(field(d, obj, d.k, { ...opts, base: opts.baseObj ? opts.baseObj[d.k] : undefined, orig: opts.origObj ? opts.origObj[d.k] : obj[d.k] }));
  }
  return frag;
}

function renderUpdates() {
  const up = cfg.update, orig = JSON.parse(saved).update || {};
  const f = (k, t, l, h) => field({ k, t, l, h }, up, k, { prefix: "up", orig: orig[k] });
  const box = el("div", { class: "update-status", "aria-live": "polite" });
  const draw = (st) => {
    const L = st.latest;
    const when = st.last_check && !String(st.last_check).startsWith("0001") ? new Date(st.last_check).toLocaleString() : "ещё не проверялось";
    const busy = { checking: "Проверяю…", downloading: "Скачиваю" + (st.total ? ` ${Math.round(100 * st.done / st.total)}%` : "…"), installing: "Устанавливаю — программа перезапустится" }[st.status];
    box.replaceChildren(...[
      el("p", {}, "Установлена версия ", el("b", {}, st.current), ". Последняя проверка: " + when + "."),
      busy ? el("p", {}, busy) : null,
      st.error ? el("p", { class: "note" }, st.error) : null,
      L ? el("div", { class: "release" },
        el("p", {}, el("b", {}, "Доступна версия " + L.version), L.version === st.skipped ? " (вы решили её пропустить)" : "",
          L.url ? el("span", {}, " · ", el("a", { href: "#", onclick: (e) => { e.preventDefault(); act("open"); } }, "страница выпуска")) : null),
        L.notes ? el("pre", { class: "notes" }, L.notes) : null)
        : (st.status === "idle" && st.last_check && !String(st.last_check).startsWith("0001") ? el("p", {}, "У вас последняя версия.") : null),
      el("div", { class: "actions", style: "padding:6px 0 14px" },
        el("button", { class: "btn", onclick: () => act("check") }, "Проверить сейчас"),
        L ? el("button", { class: "btn primary", onclick: () => { if (confirm(`Установить версию ${L.version}? Программа закроется и запустится снова.`)) act("install"); } }, "Обновить до " + L.version) : null,
        L && L.version !== st.skipped ? el("button", { class: "btn", onclick: () => act("skip") }, "Пропустить эту версию") : null)].filter(Boolean));
  };
  const act = async (op) => {
    try { draw(await api("/api/update", { op })); if (op === "skip") await load(); } catch (e) { toast(e.message, true); }
  };
  const poll = async () => {
    try { const st = await api("/api/update"); draw(st); if (["checking", "downloading", "installing"].includes(st.status) && document.body.contains(box)) setTimeout(poll, 700); }
    catch (e) { box.replaceChildren(el("p", { class: "empty" }, e.message)); }
  };
  poll();
  return el("div", { class: "group" },
    el("h3", {}, "Обновления"),
    f("check", "bool", "Проверять обновления", "С GitHub, страница выпусков проекта."),
    f("auto", "bool", "Автообновление", "Скачивать и устанавливать новую версию самостоятельно — когда минуту ничего не печатаете. Файл проверяется по контрольной сумме."),
    f("interval_hours", "int", "Проверять раз в, часов"),
    f("prerelease", "bool", "Предлагать бета-версии"),
    box);
}

function hotkeyString(e) {
  const parts = [];
  if (e.ctrlKey) parts.push("Ctrl"); if (e.altKey) parts.push("Alt"); if (e.shiftKey) parts.push("Shift"); if (e.metaKey) parts.push("Win");
  const map = { Pause: "Pause", Cancel: "Pause", CapsLock: "CapsLock", ScrollLock: "ScrollLock", Insert: "Insert", Delete: "Delete", Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown", Space: "Space", Tab: "Tab", Enter: "Enter", Escape: "Esc", Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\", Semicolon: ";", Quote: "'", Comma: ",", Period: ".", Slash: "/", ContextMenu: "Apps", ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down" };
  let key = null;
  if (/^Key[A-Z]$/.test(e.code)) key = e.code.slice(3);
  else if (/^Digit\d$/.test(e.code)) key = e.code.slice(5);
  else if (/^F\d+$/.test(e.code)) key = e.code;
  else if (map[e.code]) key = map[e.code];
  else if (map[e.key]) key = map[e.key];
  if (!key) return null;
  parts.push(key);
  return parts.join("+");
}

    el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Что"), el("th", {}, "На что"), el("th", {}, "Регистр"), el("th", {}))), tb),
    el("div", { class: "actions", style: "padding:12px 0" }, el("button", { class: "btn small", onclick: () => { w.autoreplace.push({ from: "", to: "" }); redraw(); } }, "Добавить автозамену"))),
    el("div", { class: "group" }, el("h3", {}, "Не собирать"),
      el("p", { class: "help" }, "Слова, которые вы удалили из собранных. Автоматический сбор их больше не добавит."),
      el("div", { class: "cols", style: "padding-bottom:14px" }, wordsArea("", "Русские", w.ignored, "ru"), wordsArea("", "Украинские", w.ignored, "uk"), wordsArea("", "Английские", w.ignored, "en"))),
    el("div", { class: "actions" }, el("button", { class: "btn primary", onclick: () => saveWords() }, "Сохранить словарь"),
      el("button", { class: "btn", onclick: () => { W = null; render(); } }, "Отменить изменения")));
}

const KIND = { exception: "отменили исправление", manual: "сконвертировали вручную", passive: "набирали без исправления" };
function renderLearned(m) {
  const w = wordsState();
  let q = "", kind = "";
  m.append(el("h2", {}, "Собранные слова"),
    el("p", { class: "lead" }, "Сюда программа сама складывает слова. Исключения — те, чьё исправление вы отменили. Свои слова — те, что вы переводили вручную или часто набирали. Одно слово хранится один раз, повторы только увеличивают счётчик."));
  const filt = el("div", { class: "filters" },
    el("input", { type: "text", placeholder: "Найти слово", "aria-label": "Найти слово", oninput: e => { q = e.target.value.toLowerCase(); draw(); } }),
    (() => { const s = el("select", { "aria-label": "Откуда", onchange: e => { kind = e.target.value; draw(); } }, el("option", { value: "" }, "Все источники"), Object.entries(KIND).map(([k, v]) => el("option", { value: k }, "Вы " + v))); return s; })());
  const total = (w.learned || []).length + (w.candidates || []).length;
  const undo = renderLearned.undo;
  m.append(el("div", { class: "actions", style: "margin:0 0 12px" },
    el("button", { class: "btn danger", disabled: total === 0, onclick: () => confirmReset(w, total) }, "Сбросить собранные слова…"),
    undo ? el("button", { class: "btn", onclick: () => {
      w.learned = undo.learned; w.candidates = undo.candidates; w.ignored = undo.ignored;
      renderLearned.undo = null; saveWords("Собранные слова возвращены");
    } }, "Вернуть сброшенные слова") : null));
  const learnedBox = el("div"), candBox = el("div");
  m.append(filt, el("div", { class: "group" }, el("h3", {}, "Действуют"), learnedBox), el("div", { class: "group" }, el("h3", {}, "Кандидаты"),
    el("p", { class: "help" }, "Ещё не набрали нужного числа повторов или ждут вашей проверки."), candBox));
  const ignore = (e) => { (w.ignored[e.lang] ||= []).includes(e.w) || w.ignored[e.lang].push(e.w); };
  const table = (list, isCand) => {
    const rows = list.map((e, i) => ({ e, i })).filter(({ e }) => (!q || e.w.includes(q)) && (!kind || e.kind === kind));
    if (!rows.length) return el("p", { class: "empty" }, list.length ? "Ничего не найдено." : isCand ? "Кандидатов нет." : "Пока ничего не собрано. Слова появятся, когда вы будете отменять исправления или конвертировать вручную.");
    rows.sort((a, b) => b.e.n - a.e.n || String(b.e.last).localeCompare(String(a.e.last)));
    return el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Слово"), el("th", {}, "Как"), el("th", {}, "Раз"), el("th", {}, "Где"), el("th", {}))),
      el("tbody", {}, rows.slice(0, 500).map(({ e, i }) => el("tr", {},
        el("td", { class: "word" }, el("span", { class: "lang " + e.lang }, e.lang.toUpperCase()), " ",
          el("input", { type: "text", value: e.w, "aria-label": "Слово", style: "width:auto;min-width:10ch;display:inline-block", onchange: ev => { e.w = ev.target.value.trim().toLowerCase(); saveWords("Слово изменено"); } })),
        el("td", {}, e.kind === "exception" ? "исключение" : "своё слово", el("div", { class: "help" }, "вы " + (KIND[e.kind] || ""))),
        el("td", {}, String(e.n)),
        el("td", { class: "help" }, (e.apps || []).join(", ")),
        el("td", {},
          isCand ? el("button", { class: "btn small", onclick: () => { w.candidates.splice(i, 1); w.learned.push(e); saveWords("Принято"); } }, "Принять") : null,
          e.kind !== "exception" ? el("button", { class: "btn small", title: "Сделать исключением: никогда не исправлять", onclick: () => { e.kind = "exception"; saveWords("Перенесено в исключения"); } }, "В исключения")
            : el("button", { class: "btn small", title: "Сделать своим словом", onclick: () => { e.kind = "manual"; saveWords("Перенесено в свои слова"); } }, "В свои слова"),
          el("button", { class: "btn small danger", title: "Удалить и больше не собирать", onclick: () => { (isCand ? w.candidates : w.learned).splice(i, 1); ignore(e); saveWords("Удалено, больше не будет собираться"); } }, "Удалить"))))));
  };
  const draw = () => { learnedBox.replaceChildren(table(w.learned || [], false)); candBox.replaceChildren(table(w.candidates || [], true)); };
  draw();
}

// Подтверждение сброса собранных слов.
function confirmReset(w, total) {
  let alsoIgnored = false;
  const ignoredN = Object.values(w.ignored || {}).reduce((n, l) => n + l.length, 0);
  const back = el("div", { class: "modal-back" });
  const close = () => back.remove();
  const box = el("div", { class: "modal", role: "alertdialog", "aria-modal": "true", "aria-labelledby": "rs-title" },
    el("h2", { id: "rs-title" }, "Сбросить собранные слова?"),
    el("p", {}, `Будут удалены все слова, которые программа собрала сама: действующие и кандидаты — всего ${total}. ` +
      "Отменённые исправления снова начнут исправляться, а слова, которые вы переводили вручную, — нет, пока программа не соберёт их заново."),
    el("p", { class: "help" }, "Ваш словарь (свои слова, исключения, автозамены) и история набора не изменятся. До закрытия окна настроек сброс можно отменить."),
    ignoredN ? el("div", { class: "choice" }, el("label", {},
      el("input", { type: "checkbox", onchange: e => alsoIgnored = e.target.checked }),
      el("span", {}, el("b", {}, `Очистить и список «Не собирать» (${ignoredN})`), el("small", {}, "Удалённые вами раньше слова снова смогут собираться")))) : null,
    el("div", { class: "foot" },
      el("button", { class: "btn", onclick: close }, "Отмена"),
      el("button", { class: "btn primary danger-fill", onclick: () => {
        renderLearned.undo = structuredClone({ learned: w.learned || [], candidates: w.candidates || [], ignored: w.ignored || {} });
        w.learned = []; w.candidates = [];
        if (alsoIgnored) w.ignored = { ru: [], uk: [], en: [] };
        close(); saveWords("Собранные слова сброшены");
      } }, "Сбросить")));
  back.append(box);
  back.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  back.addEventListener("click", e => { if (e.target === back) close(); });
  document.body.append(back);
  box.querySelector(".foot .btn").focus(); // по умолчанию — «Отмена»
}

function renderProbe(m) {
  const ta = el("textarea", { id: "probe", placeholder: "ghbdtn rfr ltkf  или  руддщ цщкдв" });
  const app = el("input", { type: "text", list: "recent-apps2", placeholder: "например WindowsTerminal.exe", value: renderProbe.app || "" });
  const out = el("div", { class: "caps", "aria-live": "polite" });
  let t;
  const run = () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      renderProbe.text = ta.value; renderProbe.app = app.value;
      if (!ta.value.trim()) { out.replaceChildren(el("p", { class: "empty" }, "Наберите слова — увидите, что с ними сделает программа.")); return; }
      try {
        const seq = (run.seq = (run.seq || 0) + 1);
        if (!out.querySelector(".cap")) out.replaceChildren(el("p", { class: "empty" }, "Проверяю…"));
        const res = await api("/api/analyze", { text: ta.value, app: app.value });
        if (seq !== run.seq) return; // пришёл ответ на устаревший текст
        out.replaceChildren(...res.map(r => {
          const f = r.final;
          if (r.error) return el("div", { class: "cap" }, el("div", { class: "from" }, r.word), el("div", { class: "why" }, r.error));
          const target = f.alt_lang || (r.typed_in === "en" ? "ru" : "en");
          return el("div", { class: "cap" + (f.switch ? " sw-" + target : "") },
            el("div", { class: "from" }, r.word + "  ·  " + r.typed_in.toUpperCase()),
            el("div", { class: "to" }, f.switch ? f.alt : (r.typo && r.typo.applied ? r.typo.best : r.word)),
            el("div", { class: "why" }, (f.switch ? "Раскладка исправится: " : "Раскладка верная: ") + f.reason +
              (r.early ? `. Посреди слова переключится после ${r.early_at}-й буквы` : "")),
            el("div", { class: "nums" }, `буквы ${f.cur_score.toFixed(2)} → ${f.alt_score.toFixed(2)}, частота ${f.cur_zipf || "—"} → ${f.alt_zipf || "—"}`),
            r.typo ? el("div", { class: "why typo" }, r.typo.applied ? `Опечатка: исправится на «${r.typo.best}»` : (r.typo.best ? `Опечатка? Подсказка «${r.typo.best}», само не исправится: ${r.typo.reason}` : "Опечатка? Похожих слов нет"),
              r.typo.candidates && r.typo.candidates.length > 1 ? el("div", { class: "nums" }, "варианты: " + r.typo.candidates.join(", ")) : null) : null,
            r.completions && r.completions.length ? el("div", { class: "nums" }, "подсказки на «" + [...r.word].slice(0, (cfg.defaults.predict_min_prefix || 2) + 1).join("") + "»: " + r.completions.join(", ")) : null);
        }));
      } catch (e) { out.replaceChildren(el("p", { class: "empty" }, e.message)); }
    }, 200);
  };
  ta.value = renderProbe.text || "";
  ta.addEventListener("input", run); app.addEventListener("input", run);
  m.append(el("h2", {}, "Проверка"),
    el("p", { class: "lead" }, "Наберите текст как есть — программа покажет, что исправит (раскладку и опечатки), какие подскажет варианты и почему. Проверка идёт по сохранённым настройкам, так что после изменения порогов сначала сохраните."),
    el("datalist", { id: "recent-apps2" }, (S.apps || []).map(a => el("option", { value: a }))),
    el("div", { class: "group probe" },
      el("div", { class: "row wide" }, el("label", { for: "probe" }, "Текст"), ta),
      el("div", { class: "row" }, el("div", {}, el("label", {}, "Как будто в программе"), el("div", { class: "help" }, "Пусто — общие правила.")), app)),
    out);
  run();
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
  document.execCommand("copy"); ta.remove(); return Promise.resolve();
}

function renderDiagnostics() {
  const box = el("div", {});
  const draw = (d) => {
    const crashes = d.crashes || [];
    box.replaceChildren(...[
      el("p", { class: "help" }, "Отчёт содержит версию программы и Windows, сведения о раскладках, последний сбой и служебный журнал. Набранного текста и вашего имени пользователя в нём нет."),
      el("div", { class: "actions", style: "padding:6px 0 12px" },
        el("button", { class: "btn primary", onclick: async () => { await api("/api/diag", { op: "issue" }); toast("Открыта форма на GitHub — проверьте текст и отправьте"); } }, "Сообщить об ошибке на GitHub"),
        el("button", { class: "btn", onclick: async () => { await copyText(d.report); toast("Отчёт скопирован"); } }, "Скопировать отчёт"),
        crashes.length ? el("button", { class: "btn danger", onclick: async () => draw(await api("/api/diag", { op: "clear" })) }, "Удалить отчёты о сбоях") : null),
      crashes.length ? el("div", {}, el("h3", {}, "Сбои"),
        ...crashes.map(c => el("details", { class: "crash" }, el("summary", {}, new Date(c.time).toLocaleString() + " — " + ((c.text || "").match(/Где: (.*)/) || [, "аварийное завершение"])[1]),
          el("pre", { class: "notes" }, c.text || ""))))
        : el("p", { class: "empty" }, "Сбоев не было."),
    ].filter(Boolean));
  };
  api("/api/diag").then(draw).catch(e => box.replaceChildren(el("p", { class: "empty" }, e.message)));
  return el("div", { class: "group" }, el("h3", {}, "Ошибки и отчёты"), box);
}

async function renderLog(m) {
  m.append(el("h2", {}, "Журнал"),
    el("p", { class: "lead" }, "Последние решения программы с объяснением. Хранится только в памяти, пока программа запущена."),
    renderDiagnostics());
  if (!S.config.log_decisions) m.append(el("p", { class: "note" }, "Журнал выключен. Включите его на вкладке «Общие» и сохраните."));
  const box = el("div", { class: "group log" });
  m.append(el("div", { class: "actions", style: "margin-bottom:12px" },
    el("button", { class: "btn", onclick: () => draw() }, "Обновить"),
    el("button", { class: "btn danger", onclick: async () => { await api("/api/log", {}); draw(); } }, "Очистить")), box);
  const draw = async () => {
    try {
      const list = await api("/api/log");
      if (!list || !list.length) { box.replaceChildren(el("p", { class: "empty" }, "Записей нет.")); return; }
      box.replaceChildren(el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Время"), el("th", {}, "Где"), el("th", {}, "Слово"), el("th", {}, "Решение"))),
        el("tbody", {}, list.slice().reverse().map(x => el("tr", {},
          el("td", {}, new Date(x.time).toLocaleTimeString()),
          el("td", {}, x.app, el("div", { class: "help" }, x.rule + ", " + x.event)),
          el("td", { class: "word" }, x.v.cur, x.v.switch || x.event === "вручную" ? " → " + x.v.alt : ""),
          el("td", {}, (x.v.switch ? "исправлено: " : x.event === "вручную" || x.event === "отмена" ? "" : "оставлено: ") + x.v.reason))))));
    } catch (e) { box.replaceChildren(el("p", { class: "empty" }, e.message)); }
  };
  draw();
}

// ---------- Сохранение ----------
async function saveConfig() {
  try {
    const r = await api("/api/config", cfg);
    S.config = r.config; cfg = structuredClone(r.config); saved = JSON.stringify(cfg); markDirty(); render();
    const st = await api("/api/state"); S.status = st.status; renderStatus();
    toast("Настройки сохранены и уже действуют");
    return true;
  } catch (e) { toast(e.message, true); return false; }
}
$("#save").addEventListener("click", saveConfig);
// Окно программы при закрытии с несохранёнными изменениями вызывает это после «Да».
window.erisedSaveAndClose = async () => { if (await saveConfig() && window.erisedClose) window.erisedClose(); };
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== tab && TABS.some(x => x[0] === t)) { tab = t; render(); } });
$("#revert").addEventListener("click", () => { cfg = JSON.parse(saved); markDirty(); render(); });
window.addEventListener("beforeunload", e => { if (JSON.stringify(cfg) !== saved) { e.preventDefault(); e.returnValue = ""; } });

load().catch(e => { document.body.replaceChildren(el("main", {}, el("h2", {}, "Не удалось открыть настройки"), el("p", { class: "lead" }, e.message + ". Откройте настройки заново из меню значка Erised Switcher в трее."))); });
</script>
